<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: html_head('Hồ Sơ Tài Sản Cố Định')}"></head>
<body>
<div th:replace="~{layout/main :: wrapper('Danh Sách Tài Sản Cố Định', ~{::#content})}">
    <div id="content">
        <!-- Search & Filter Card -->
        <div class="card shadow-sm border mb-4">
            <div class="card-body p-3">
                <form th:action="@{/taisan}" method="get" class="row g-2 align-items-center">
                    <div class="col-md-3">
                        <input type="text" class="form-control" name="kw" th:value="${kw}" placeholder="Tìm theo mã, tên, số hóa đơn...">
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" name="maLoai">
                            <option value="">-- Tất cả loại --</option>
                            <option th:each="l : ${listLoai}" th:value="${l.maLoai}" th:text="${l.tenLoai}" th:selected="${l.maLoai == maLoai}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" name="maPB">
                            <option value="">-- Tất cả đơn vị --</option>
                            <option th:each="pb : ${listPhongBan}" th:value="${pb.maPhongBan}" th:text="${pb.tenPhongBan}" th:selected="${pb.maPhongBan == maPB}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" name="tinhTrang">
                            <option value="">-- Tất cả tình trạng --</option>
                            <option value="Trong kho" th:selected="${tinhTrang == 'Trong kho'}">Trong kho</option>
                            <option value="Đang sử dụng" th:selected="${tinhTrang == 'Đang sử dụng'}">Đang sử dụng</option>
                            <option value="Đang bảo trì" th:selected="${tinhTrang == 'Đang bảo trì'}">Đang bảo trì</option>
                            <option value="Chờ thanh lý" th:selected="${tinhTrang == 'Chờ thanh lý'}">Chờ thanh lý</option>
                            <option value="Đã thanh lý" th:selected="${tinhTrang == 'Đã thanh lý'}">Đã thanh lý</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100 fw-semibold">Lọc dữ liệu</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Table List -->
        <div class="card shadow-sm border mb-4">
            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3 border-bottom">
                <div>
                    <span class="fw-bold text-dark">Danh Sách Tài Sản Cố Định</span>
                    <span class="badge bg-light text-secondary border ms-2" th:text="${#lists.size(listTaiSan)} + ' tài sản'"></span>
                </div>
                <!-- Nút Tiếp Nhận Tài Sản Mới: Mở Modal trực tiếp giống trang Quản Lý Tài Khoản -->
                <button th:if="${session.currentUser.vaiTro.maVaiTro == 'VT_ADMIN' or session.currentUser.vaiTro.maVaiTro == 'VT_QLTS'}" 
                        type="button" 
                        class="btn btn-sm btn-primary fw-semibold px-3" 
                        data-bs-toggle="modal" 
                        data-bs-target="#modalThemTaiSan">
                    Tiếp nhận tài sản mới
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th class="text-nowrap" style="width: 110px;">Mã TS</th>
                            <th class="text-nowrap" style="min-width: 220px;">Tên Tài Sản</th>
                            <th class="text-nowrap" style="width: 140px;">Loại Tài Sản</th>
                            <th class="text-nowrap" style="width: 180px;">Đơn Vị Sử Dụng</th>
                            <th class="text-end text-nowrap" style="width: 140px;">Nguyên Giá</th>
                            <th class="text-end text-nowrap" style="width: 140px;">Giá Trị Còn Lại</th>
                            <th class="text-nowrap" style="width: 130px;">Tình Trạng</th>
                            <th class="text-center text-nowrap" style="width: 120px;">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ts : ${listTaiSan}">
                            <td><code class="fw-bold" th:text="${ts.maTaiSan}"></code></td>
                            <td>
                                <a th:href="@{'/taisan/chitiet/' + ${ts.maTaiSan}}" class="text-dark fw-bold text-decoration-none" th:text="${ts.tenTaiSan}"></a>
                                <br><small class="text-muted" th:text="'HĐ: ' + ${ts.soHoaDon}"></small>
                            </td>
                            <td><span class="badge bg-white text-dark border px-2.5 py-1 fw-semibold" th:text="${ts.loaiTaiSan.tenLoai}"></span></td>
                            <td>
                                <span th:if="${ts.phongBan != null}" class="fw-semibold text-dark" th:text="${ts.phongBan.tenPhongBan}"></span>
                                <span th:if="${ts.phongBan == null}" class="text-muted fst-italic">Kho trung tâm</span>
                                <br><small class="text-muted" th:text="${ts.viTri}"></small>
                            </td>
                            <td class="text-end fw-semibold text-dark" th:text="${#numbers.formatDecimal(ts.nguyenGia, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td class="text-end fw-semibold text-dark" th:text="${#numbers.formatDecimal(ts.giaTriConLai, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${ts.tinhTrang == 'Trong kho' ? 'badge-status-trongkho' : (ts.tinhTrang == 'Đang sử dụng' ? 'badge-status-sudung' : (ts.tinhTrang == 'Đang bảo trì' ? 'badge-status-baotri' : 'badge-status-thanhly'))}" 
                                      th:text="${ts.tinhTrang}"></span>
                            </td>
                            <td class="text-center text-nowrap">
                                <!-- Nút Xem: Icon con mắt vào thẳng trang chi tiết -->
                                <a th:href="@{'/taisan/chitiet/' + ${ts.maTaiSan}}" 
                                   class="btn btn-sm btn-outline-primary me-1" 
                                   title="Xem chi tiết hồ sơ tài sản">
                                    <i class="fa-solid fa-eye"></i>
                                </a>

                                <th:block th:if="${session.currentUser.vaiTro.maVaiTro == 'VT_ADMIN' or session.currentUser.vaiTro.maVaiTro == 'VT_QLTS'}">
                                    <!-- Nút Sửa: Mở Modal Chỉnh Sửa Thông Tin -->
                                    <button type="button" 
                                            class="btn btn-sm btn-outline-warning me-1" 
                                            data-bs-toggle="modal" 
                                            th:data-bs-target="'#modalEditTS_' + ${ts.maTaiSan}" 
                                            title="Chỉnh sửa thông tin tài sản">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </button>

                                    <!-- Nút Xóa: Chỉ cho phép xóa khi tài sản đang ở trạng thái 'Trong kho' -->
                                    <a th:if="${ts.tinhTrang == 'Trong kho'}" 
                                       th:href="@{'/taisan/xoa/' + ${ts.maTaiSan}}" 
                                       class="btn btn-sm btn-outline-danger" 
                                       onclick="return confirm('Bạn có chắc chắn muốn xóa tài sản này khỏi kho? Hành động này không thể hoàn tác!');" 
                                       title="Xóa tài sản trong kho">
                                        <i class="fa-solid fa-trash"></i>
                                    </a>
                                    <button th:unless="${ts.tinhTrang == 'Trong kho'}" 
                                            type="button" 
                                            class="btn btn-sm btn-outline-secondary" 
                                            disabled 
                                            th:title="'Không thể xóa vì tài sản đang ở trạng thái: ' + ${ts.tinhTrang} + ' (chỉ được xóa khi Trong kho)'">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </th:block>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listTaiSan)}">
                            <td colspan="8" class="text-center text-muted py-4">Không tìm thấy tài sản nào phù hợp điều kiện lọc!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 1. Modal Tiếp Nhận Tài Sản Mới (Giao diện chuẩn giống form thêm tài khoản mới) -->
        <div class="modal fade" id="modalThemTaiSan" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content shadow border-0">
                    <form th:action="@{/taisan/luu}" method="post">
                        <div class="modal-header bg-white border-bottom py-3 px-4">
                            <h5 class="modal-title fs-6 fw-bold text-dark">Tiếp Nhận Tài Sản Cố Định Mới</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                        </div>
                        <div class="modal-body p-4">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small text-secondary">Mã Tài Sản <span class="text-danger">*</span></label>
                                    <input type="text" name="maTaiSan" class="form-control" placeholder="VD: TS_PC05" required>
                                </div>
                                <div class="col-md-8">
                                    <label class="form-label fw-semibold small text-secondary">Tên Tài Sản <span class="text-danger">*</span></label>
                                    <input type="text" name="tenTaiSan" class="form-control" placeholder="VD: Máy tính để bàn Dell OptiPlex 7090" required>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small text-secondary">Phân Loại Tài Sản <span class="text-danger">*</span></label>
                                    <select name="loaiTaiSan.maLoai" class="form-select" required>
                                        <option value="">-- Chọn loại tài sản --</option>
                                        <option th:each="l : ${listLoai}" th:value="${l.maLoai}" th:text="${l.tenLoai} + ' (' + ${l.tyLeKhauHao} + '%/năm)'"></option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small text-secondary">Nhà Cung Cấp <span class="text-danger">*</span></label>
                                    <select name="nhaCungCap.maNCC" class="form-select" required>
                                        <option value="">-- Chọn nhà cung cấp --</option>
                                        <option th:each="ncc : ${listNCC}" th:value="${ncc.maNCC}" th:text="${ncc.tenNCC}"></option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small text-secondary">Phòng Ban Quản Lý</label>
                                    <select name="phongBan.maPhongBan" class="form-select">
                                        <option value="">-- Kho tài sản trung tâm --</option>
                                        <option th:each="pb : ${listPhongBan}" th:value="${pb.maPhongBan}" th:text="${pb.tenPhongBan}"></option>
                                    </select>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small text-secondary">Nguyên Giá (VNĐ) <span class="text-danger">*</span></label>
                                    <input type="number" step="1000" name="nguyenGia" class="form-control" placeholder="20000000" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label fw-semibold small text-secondary">Đơn Vị Tính</label>
                                    <input type="text" name="donViTinh" class="form-control" placeholder="Cái / Bộ" value="Cái">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold small text-secondary">Số Hóa Đơn Mua <span class="text-danger">*</span></label>
                                    <input type="text" name="soHoaDon" class="form-control" placeholder="HD-2026-001" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold small text-secondary">Năm Sản Xuất <span class="text-danger">*</span></label>
                                    <input type="number" name="namSanXuat" class="form-control" placeholder="2025" value="2025" required>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small text-secondary">Ngày Tiếp Nhận</label>
                                    <input type="date" name="ngayTiepNhan" th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small text-secondary">Tình Trạng</label>
                                    <select name="tinhTrang" class="form-select">
                                        <option value="Trong kho" selected>Trong kho</option>
                                        <option value="Đang sử dụng">Đang sử dụng</option>
                                        <option value="Đang bảo trì">Đang bảo trì</option>
                                        <option value="Chờ thanh lý">Chờ thanh lý</option>
                                        <option value="Đã thanh lý">Đã thanh lý</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small text-secondary">Vị Trí Cụ Thể</label>
                                    <input type="text" name="viTri" class="form-control" placeholder="Kệ A2, Kho trung tâm">
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer bg-light border-top py-3 px-4 d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-outline-secondary px-3" data-bs-dismiss="modal">Hủy Bỏ</button>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">Lưu tài sản</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 2. Modal Chỉnh Sửa cho từng dòng tài sản -->
        <th:block th:each="ts : ${listTaiSan}">
            <!-- Modal Chỉnh Sửa Thông Tin Tài Sản (Form giống trang Quản Lý Tài Khoản) -->
            <div th:if="${session.currentUser.vaiTro.maVaiTro == 'VT_ADMIN' or session.currentUser.vaiTro.maVaiTro == 'VT_QLTS'}" 
                 class="modal fade" 
                 th:id="'modalEditTS_' + ${ts.maTaiSan}" 
                 tabindex="-1" 
                 aria-hidden="true">
                <div class="modal-dialog modal-lg modal-dialog-centered">
                    <div class="modal-content shadow border-0">
                        <form th:action="@{/taisan/luu}" method="post">
                            <div class="modal-header bg-white border-bottom py-3 px-4">
                                <h5 class="modal-title fs-6 fw-bold text-dark">
                                    Chỉnh Sửa Thông Tin: <span th:text="${ts.tenTaiSan}"></span> (<span th:text="${ts.maTaiSan}"></span>)
                                </h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                            </div>
                            <div class="modal-body p-4">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small text-secondary">Mã Tài Sản</label>
                                        <input type="text" name="maTaiSan" th:value="${ts.maTaiSan}" readonly class="form-control bg-light fw-bold text-secondary">
                                    </div>
                                    <div class="col-md-8">
                                        <label class="form-label fw-semibold small text-secondary">Tên Tài Sản <span class="text-danger">*</span></label>
                                        <input type="text" name="tenTaiSan" th:value="${ts.tenTaiSan}" required class="form-control">
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small text-secondary">Phân Loại Tài Sản <span class="text-danger">*</span></label>
                                        <select name="loaiTaiSan.maLoai" class="form-select" required>
                                            <option th:each="l : ${listLoai}" th:value="${l.maLoai}" th:text="${l.tenLoai} + ' (' + ${l.tyLeKhauHao} + '%/năm)'" th:selected="${ts.loaiTaiSan != null and l.maLoai == ts.loaiTaiSan.maLoai}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small text-secondary">Nhà Cung Cấp <span class="text-danger">*</span></label>
                                        <select name="nhaCungCap.maNCC" class="form-select" required>
                                            <option th:each="ncc : ${listNCC}" th:value="${ncc.maNCC}" th:text="${ncc.tenNCC}" th:selected="${ts.nhaCungCap != null and ncc.maNCC == ts.nhaCungCap.maNCC}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small text-secondary">Phòng Ban Quản Lý</label>
                                        <select name="phongBan.maPhongBan" class="form-select">
                                            <option value="">-- Kho tài sản trung tâm --</option>
                                            <option th:each="pb : ${listPhongBan}" th:value="${pb.maPhongBan}" th:text="${pb.tenPhongBan}" th:selected="${ts.phongBan != null and pb.maPhongBan == ts.phongBan.maPhongBan}"></option>
                                        </select>
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small text-secondary">Nguyên Giá (VNĐ) <span class="text-danger">*</span></label>
                                        <input type="number" step="1000" name="nguyenGia" th:value="${ts.nguyenGia}" class="form-control" required>
                                    </div>
                                    <div class="col-md-2">
                                        <label class="form-label fw-semibold small text-secondary">Đơn Vị Tính</label>
                                        <input type="text" name="donViTinh" th:value="${ts.donViTinh}" class="form-control">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label fw-semibold small text-secondary">Số Hóa Đơn Mua <span class="text-danger">*</span></label>
                                        <input type="text" name="soHoaDon" th:value="${ts.soHoaDon}" class="form-control" required>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label fw-semibold small text-secondary">Năm Sản Xuất <span class="text-danger">*</span></label>
                                        <input type="number" name="namSanXuat" th:value="${ts.namSanXuat}" class="form-control" required>
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small text-secondary">Ngày Tiếp Nhận</label>
                                        <input type="date" name="ngayTiepNhan" th:value="${ts.ngayTiepNhan}" class="form-control">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small text-secondary">Tình Trạng</label>
                                        <select name="tinhTrang" class="form-select">
                                            <option value="Trong kho" th:selected="${ts.tinhTrang == 'Trong kho'}">Trong kho</option>
                                            <option value="Đang sử dụng" th:selected="${ts.tinhTrang == 'Đang sử dụng'}">Đang sử dụng</option>
                                            <option value="Đang bảo trì" th:selected="${ts.tinhTrang == 'Đang bảo trì'}">Đang bảo trì</option>
                                            <option value="Chờ thanh lý" th:selected="${ts.tinhTrang == 'Chờ thanh lý'}">Chờ thanh lý</option>
                                            <option value="Đã thanh lý" th:selected="${ts.tinhTrang == 'Đã thanh lý'}">Đã thanh lý</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small text-secondary">Vị Trí Cụ Thể</label>
                                        <input type="text" name="viTri" th:value="${ts.viTri}" class="form-control">
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer bg-light border-top py-3 px-4 d-flex justify-content-end gap-2">
                                <button type="button" class="btn btn-outline-secondary px-3" data-bs-dismiss="modal">Hủy Bỏ</button>
                                <button type="submit" class="btn btn-primary px-4 fw-semibold">Lưu Cập Nhật</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </th:block>

    </div>
</div>
</body>
</html>
