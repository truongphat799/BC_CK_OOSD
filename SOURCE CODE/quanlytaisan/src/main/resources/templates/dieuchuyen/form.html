<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: html_head('Lập Phiếu Điều Chuyển')}"></head>
<body>
<div th:replace="~{layout/main :: wrapper('Lập Phiếu Điều Chuyển Tài Sản', ~{::#content})}">
    <div id="content">
        <form th:action="@{/dieuchuyen/luu}" th:object="${phieu}" method="post">
            <div class="row">
                <div class="col-lg-5">
                    <div class="card shadow-sm border mb-4">
                        <div class="card-header bg-white py-3 border-bottom">
                            <span class="fw-bold text-dark">Thông Tin Điều Chuyển</span>
                        </div>
                        <div class="card-body p-4">
                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">Số Phiếu Điều Chuyển <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{soPhieuDC}" class="form-control bg-light fw-bold text-secondary" required readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">Ngày Điều Chuyển <span class="text-danger">*</span></label>
                                <input type="date" th:field="*{ngayDieuChuyen}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">Đơn Vị Chuyển Đi <span class="text-danger">*</span></label>
                                <select th:field="*{phongBanChuyen.maPhongBan}" class="form-select" required>
                                    <option value="">-- Chọn đơn vị chuyển đi --</option>
                                    <option th:each="pb : ${listPhongBan}" th:value="${pb.maPhongBan}" th:text="${pb.tenPhongBan}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">Đơn Vị Tiếp Nhận Mới <span class="text-danger">*</span></label>
                                <select name="maPhongBanNhanMoi" class="form-select" required>
                                    <option value="">-- Chọn đơn vị tiếp nhận mới --</option>
                                    <option th:each="pb : ${listPhongBan}" th:value="${pb.maPhongBan}" th:text="${pb.tenPhongBan}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">Vị Trí Lắp Đặt Mới</label>
                                <input type="text" name="viTriMoi" class="form-control" placeholder="VD: Phòng họp số 2 Tòa B" value="Phòng mới">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">Lý Do Điều Chuyển <span class="text-danger">*</span></label>
                                <textarea th:field="*{lyDoDieuChuyen}" class="form-control" rows="2" placeholder="VD: Bổ sung máy chiếu cho phòng hội thảo" required></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-7">
                    <div class="card shadow-sm border mb-4">
                        <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                            <span class="fw-bold text-dark">Chọn Tài Sản Đang Sử Dụng Để Điều Chuyển</span>
                            <span class="badge bg-light text-secondary border" th:text="${#lists.size(listTaiSanDangDung)} + ' tài sản'"></span>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive" style="max-height: 480px; overflow-y: auto;">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-light sticky-top">
                                        <tr>
                                            <th style="width: 40px;" class="text-center">#</th>
                                            <th>Mã TS</th>
                                            <th>Tên Tài Sản</th>
                                            <th>Đang Ở Phòng Ban</th>
                                            <th>Vị Trí</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="ts : ${listTaiSanDangDung}">
                                            <td class="text-center">
                                                <input class="form-check-input" type="checkbox" name="maTaiSanList" th:value="${ts.maTaiSan}">
                                            </td>
                                            <td><code th:text="${ts.maTaiSan}"></code></td>
                                            <td class="fw-semibold text-dark" th:text="${ts.tenTaiSan}"></td>
                                            <td><span class="badge bg-white text-dark border px-2 py-0.5" th:text="${ts.phongBan != null ? ts.phongBan.tenPhongBan : 'Kho'}"></span></td>
                                            <td class="small text-muted" th:text="${ts.viTri}"></td>
                                        </tr>
                                        <tr th:if="${#lists.isEmpty(listTaiSanDangDung)}">
                                            <td colspan="5" class="text-center text-muted py-4">Hiện không có tài sản nào đang sử dụng để điều chuyển!</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="card-footer bg-light border-top p-3 d-flex justify-content-end gap-2">
                            <a th:href="@{/dieuchuyen}" class="btn btn-outline-secondary px-4 fw-medium">Hủy bỏ</a>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold" th:disabled="${#lists.isEmpty(listTaiSanDangDung)}">
                                Xác nhận điều chuyển
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
</body>
</html>
