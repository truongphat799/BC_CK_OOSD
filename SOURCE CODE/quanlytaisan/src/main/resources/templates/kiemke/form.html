<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: html_head('Lập Biên Bản Kiểm Kê')}"></head>
<body>
<div th:replace="~{layout/main :: wrapper('Khởi Tạo & Khảo Sát Kiểm Kê Tài Sản', ~{::#content})}">
    <div id="content">
        <!-- Bước 1: Chọn phòng ban để tải danh sách tài sản sổ sách -->
        <div class="card shadow-sm border mb-4">
            <div class="card-body p-4">
                <form th:action="@{/kiemke/tao}" method="get" class="row g-2 align-items-center">
                    <div class="col-md-5">
                        <label class="form-label small fw-semibold text-secondary">Bước 1: Chọn Đơn Vị Cần Kiểm Kê</label>
                        <select class="form-select" name="maPhongBan" onchange="this.form.submit()">
                            <option value="">-- Chọn phòng ban / khoa --</option>
                            <option th:each="pb : ${listPhongBan}" th:value="${pb.maPhongBan}" th:text="${pb.tenPhongBan}" th:selected="${pb.maPhongBan == selectedMaPB}"></option>
                        </select>
                    </div>
                    <div class="col-md-7 text-end pt-3">
                        <span class="text-muted small">Hệ thống sẽ tự động đối soát tài sản trong đơn vị với số sách sổ cái.</span>
                    </div>
                </form>
            </div>
        </div>

        <!-- Bước 2: Nhập thông tin phiếu và bảng kiểm kê thực tế -->
        <form th:if="${selectedMaPB != null && !selectedMaPB.isEmpty()}" th:action="@{/kiemke/luu}" th:object="${phieu}" method="post">
            <input type="hidden" th:field="*{phongBan.maPhongBan}">

            <div class="card shadow-sm border mb-4">
                <div class="card-header bg-white py-3 border-bottom">
                    <span class="fw-bold text-dark">Thông Tin Hội Đồng Kiểm Kê</span>
                </div>
                <div class="card-body p-4">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label fw-semibold small text-secondary">Số Phiếu Kiểm Kê</label>
                            <input type="text" th:field="*{soPhieuKK}" class="form-control bg-light fw-bold text-dark" required readonly>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold small text-secondary">Đợt Kiểm Kê</label>
                            <input type="text" th:field="*{dotKiemKe}" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold small text-secondary">Ngày Khảo Sát Thực Tế</label>
                            <input type="date" th:field="*{ngayKiemKe}" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold small text-secondary">Trưởng Ban Kiểm Kê</label>
                            <input type="text" th:field="*{truongBanKiemKe}" class="form-control" placeholder="Họ tên Trưởng ban" required>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-semibold small text-secondary">Ghi Chú Đợt Kiểm Kê</label>
                            <input type="text" th:field="*{ghiChuChung}" class="form-control" placeholder="Đánh giá sơ bộ cơ sở vật chất...">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bảng đối soát thực tế -->
            <div class="card shadow-sm border mb-4">
                <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                    <span class="fw-bold text-dark">Danh Sách Tài Sản Sổ Sách Cần Đối Soát</span>
                    <span class="badge bg-light text-secondary border ms-2" th:text="${#lists.size(assetsInDept)} + ' tài sản ghi nhận'"></span>
                </div>
                <div class="table-responsive">
                    <table class="table table-bordered align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 50px;" class="text-center">STT</th>
                                <th>Mã TS</th>
                                <th>Tên Tài Sản</th>
                                <th class="text-center" style="width: 120px;">SL Sổ Sách</th>
                                <th class="text-center" style="width: 140px;">SL Thực Tế</th>
                                <th>Tình Trạng Thực Tế Khảo Sát</th>
                                <th>Đề Xuất Xử Lý</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="ts, iter : ${assetsInDept}">
                                <td class="text-center" th:text="${iter.count}">1</td>
                                <td>
                                    <code th:text="${ts.maTaiSan}"></code>
                                    <input type="hidden" name="maTaiSanList" th:value="${ts.maTaiSan}">
                                </td>
                                <td>
                                    <strong class="text-dark" th:text="${ts.tenTaiSan}"></strong>
                                    <br><small class="text-muted" th:text="'Vị trí: ' + ${ts.viTri}"></small>
                                </td>
                                <td class="text-center fw-bold text-dark">1</td>
                                <td>
                                    <input type="number" name="soLuongThucTeList" class="form-control form-control-sm text-center fw-bold" value="1" min="0" max="10">
                                </td>
                                <td>
                                    <select name="tinhTrangList" class="form-select form-select-sm">
                                        <option value="Tốt, đang sử dụng" th:selected="${ts.tinhTrang == 'Đang sử dụng'}">Tốt, đang sử dụng</option>
                                        <option value="Hỏng nhẹ, cần sửa chữa" th:selected="${ts.tinhTrang == 'Đang bảo trì'}">Hỏng nhẹ, cần sửa chữa</option>
                                        <option value="Hư hỏng nặng, mất tính năng" th:selected="${ts.tinhTrang == 'Chờ thanh lý'}">Hư hỏng nặng, mất tính năng</option>
                                        <option value="Mất mát, không tìm thấy">Mất mát, không tìm thấy</option>
                                    </select>
                                </td>
                                <td>
                                    <input type="text" name="deXuatList" class="form-control form-control-sm" placeholder="VD: Tiếp tục sử dụng / Báo sửa / Bồi thường" value="Tiếp tục sử dụng">
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(assetsInDept)}">
                                <td colspan="7" class="text-center text-muted py-4">Đơn vị này hiện không có tài sản nào được cấp phát trên hệ thống!</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer bg-light border-top p-3 d-flex justify-content-end gap-2" th:if="${!#lists.isEmpty(assetsInDept)}">
                    <a th:href="@{/kiemke}" class="btn btn-outline-secondary px-4">Hủy bỏ</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold">
                        Lưu biên bản kiểm kê & Tự tính chênh lệch
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
</body>
</html>
