<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: html_head('Quản Lý Thanh Lý Tài Sản')}"></head>
<body>
<div th:replace="~{layout/main :: wrapper('Quản Lý Thanh Lý Tài Sản', ~{::#content})}">
    <div id="content">
        <div class="card shadow-sm border mb-4">
            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3 border-bottom">
                <div>
                    <span class="fw-bold text-dark">Danh Sách Hồ Sơ Thanh Lý Tài Sản</span>
                    <span class="badge bg-light text-secondary border ms-2" th:text="${#lists.size(listPhieu)} + ' hồ sơ'"></span>
                </div>
                <!-- Nút Lập hồ sơ thanh lý mới mở Modal trên cùng bên phải -->
                <button th:if="${session.currentUser.vaiTro.maVaiTro == 'VT_ADMIN' or session.currentUser.vaiTro.maVaiTro == 'VT_QLTS'}" 
                        type="button" class="btn btn-sm btn-primary fw-semibold px-3" 
                        data-bs-toggle="modal" data-bs-target="#modalLapHoSoThanhLy">
                    Lập hồ sơ thanh lý mới
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th class="text-nowrap" style="width: 120px;">Số Phiếu</th>
                            <th class="text-nowrap" style="width: 130px;">Ngày Lập</th>
                            <th class="text-nowrap" style="width: 170px;">Phương Thức</th>
                            <th class="text-end text-nowrap" style="width: 150px;">Tổng Nguyên Giá</th>
                            <th class="text-end text-nowrap" style="width: 150px;">Thu Hồi Dự Kiến</th>
                            <th class="text-nowrap" style="width: 160px;">Người Lập</th>
                            <th class="text-nowrap" style="width: 140px;">Trạng Thái Duyệt</th>
                            <th class="text-center text-nowrap" style="width: 120px;">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${listPhieu}">
                            <td><code class="fw-bold" th:text="${p.soPhieuTL}"></code></td>
                            <td class="small text-muted" th:text="${p.ngayThanhLy}"></td>
                            <td class="fw-semibold text-dark" th:text="${p.phuongThucThanhLy}"></td>
                            <td class="text-end fw-semibold text-dark" th:text="${#numbers.formatDecimal(p.tongNguyenGia, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td class="text-end fw-bold text-dark" th:text="${#numbers.formatDecimal(p.tongGiaTriThuHoi, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td th:text="${p.nvLap.hoTen}"></td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${p.trangThaiDuyet == 'Đã phê duyệt' ? 'badge-status-sudung' : (p.trangThaiDuyet == 'Bị từ chối' ? 'badge-status-thanhly' : 'badge-status-baotri')}" 
                                      th:text="${p.trangThaiDuyet}"></span>
                            </td>
                            <td class="text-center text-nowrap">
                                <!-- 1. Chi tiết: Icon con mắt vào thẳng trang chi tiết biên bản -->
                                <a th:href="@{'/thanhly/xem/' + ${p.soPhieuTL}}" 
                                   class="btn btn-sm btn-outline-primary me-1" 
                                   title="Xem chi tiết biên bản thanh lý">
                                    <i class="fa-solid fa-eye"></i>
                                </a>

                                <!-- 2. Nút Sửa: Chỉ khi Chờ phê duyệt và là Admin/QLTS -->
                                <button type="button" class="btn btn-sm btn-outline-warning me-1" 
                                        th:if="${p.trangThaiDuyet == 'Chờ phê duyệt' and (session.currentUser.vaiTro.maVaiTro == 'VT_ADMIN' or session.currentUser.vaiTro.maVaiTro == 'VT_QLTS')}"
                                        data-bs-toggle="modal" th:data-bs-target="'#modalSuaTL_' + ${p.soPhieuTL}" 
                                        title="Chỉnh sửa thông tin hồ sơ đề xuất thanh lý">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-secondary me-1 disabled" 
                                        th:unless="${p.trangThaiDuyet == 'Chờ phê duyệt' and (session.currentUser.vaiTro.maVaiTro == 'VT_ADMIN' or session.currentUser.vaiTro.maVaiTro == 'VT_QLTS')}" 
                                        title="Không thể sửa khi hồ sơ đã duyệt hoặc bị từ chối" disabled>
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>

                                <!-- 3. Nút Xóa: Chỉ khi Chờ phê duyệt hoặc Bị từ chối và là Admin/QLTS -->
                                <a th:if="${p.trangThaiDuyet != 'Đã phê duyệt' and (session.currentUser.vaiTro.maVaiTro == 'VT_ADMIN' or session.currentUser.vaiTro.maVaiTro == 'VT_QLTS')}" 
                                   th:href="@{'/thanhly/xoa/' + ${p.soPhieuTL}}" 
                                   class="btn btn-sm btn-outline-danger" 
                                   onclick="return confirm('CẢNH BÁO: Bạn có chắc chắn muốn hủy hồ sơ đề xuất thanh lý này?');" 
                                   title="Hủy hồ sơ đề xuất thanh lý">
                                    <i class="fa-solid fa-trash"></i>
                                </a>
                                <button type="button" class="btn btn-sm btn-outline-secondary disabled" 
                                        th:unless="${p.trangThaiDuyet != 'Đã phê duyệt' and (session.currentUser.vaiTro.maVaiTro == 'VT_ADMIN' or session.currentUser.vaiTro.maVaiTro == 'VT_QLTS')}" 
                                        title="Không thể xóa hồ sơ đã được phê duyệt chính thức" disabled>
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listPhieu)}">
                            <td colspan="8" class="text-center text-muted py-4">Chưa có hồ sơ thanh lý nào!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Modal Lập Hồ Sơ Thanh Lý Mới (Giao diện chuẩn giống form thêm tài khoản mới) -->
        <div class="modal fade" id="modalLapHoSoThanhLy" tabindex="-1" aria-hidden="true"
             th:if="${session.currentUser.vaiTro.maVaiTro == 'VT_ADMIN' or session.currentUser.vaiTro.maVaiTro == 'VT_QLTS'}">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content shadow border-0">
                    <form th:action="@{/thanhly/luu}" th:object="${phieuMoi}" method="post">
                        <div class="modal-header bg-white border-bottom py-3 px-4">
                            <h5 class="modal-title fs-6 fw-bold text-dark">Lập Hồ Sơ Đề Xuất Thanh Lý Mới</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                        </div>
                        <div class="modal-body p-4">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Số Hồ Sơ Thanh Lý <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{soPhieuTL}" class="form-control bg-light fw-bold text-dark" required readonly>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Ngày Lập Đề Xuất <span class="text-danger">*</span></label>
                                    <input type="date" th:field="*{ngayThanhLy}" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Lãnh Đạo Phê Duyệt <span class="text-danger">*</span></label>
                                    <select th:field="*{nvDuyet.maNguoiDung}" class="form-select" required>
                                        <option value="">-- Chọn lãnh đạo phê duyệt --</option>
                                        <option th:each="ld : ${listLanhDao}" th:value="${ld.maNguoiDung}" th:text="${ld.hoTen} + ' (' + ${ld.vaiTro.tenVaiTro} + ')'"></option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Phương Thức Thanh Lý <span class="text-danger">*</span></label>
                                    <select name="phuongThucThanhLy" class="form-select" required>
                                        <option value="Bán đấu giá">Bán đấu giá</option>
                                        <option value="Bán phế liệu thu hồi">Bán phế liệu thu hồi</option>
                                        <option value="Tiêu hủy phế liệu">Tiêu hủy phế liệu</option>
                                        <option value="Tháo dỡ thu hồi phụ tùng">Tháo dỡ thu hồi phụ tùng</option>
                                        <option value="Chuyển giao điều chuyển ngoại bộ">Chuyển giao điều chuyển ngoại bộ</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Chọn Tài Sản Đề Xuất Thanh Lý <span class="text-danger">*</span></label>
                                    <select name="maTaiSan" class="form-select" required>
                                        <option value="">-- Chọn tài sản cần thanh lý --</option>
                                        <option th:each="ts : ${listTaiSanCanThanhLy}" th:value="${ts.maTaiSan}" th:text="${ts.maTaiSan} + ' - ' + ${ts.tenTaiSan} + ' (' + ${ts.tinhTrang} + ' - ' + ${#numbers.formatDecimal(ts.nguyenGia, 0, 'COMMA', 0, 'POINT')} + ' đ)'"></option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Giá Trị Dự Kiến Thu Hồi (VNĐ) <span class="text-danger">*</span></label>
                                    <input type="number" step="1000" min="0" name="giaTriThuHoi" class="form-control fw-bold text-dark" placeholder="VD: 500000" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Lý Do Đề Xuất Thanh Lý <span class="text-danger">*</span></label>
                                    <textarea name="lyDoThanhLy" class="form-control" rows="2" placeholder="Hết niên hạn sử dụng, hư hỏng nặng..." required></textarea>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Hình Thức Xử Lý Sau Thanh Lý <span class="text-danger">*</span></label>
                                    <textarea name="hinhThucXuLy" class="form-control" rows="2" placeholder="Bán đấu giá xung công quỹ / Tháo dỡ linh kiện..." required></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer bg-light border-top py-3 px-4 d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-outline-secondary px-3" data-bs-dismiss="modal">Hủy Bỏ</button>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">Trình hồ sơ phê duyệt</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Các Modal Chỉnh Sửa cho từng Hồ Sơ Thanh Lý -->
        <th:block th:each="p : ${listPhieu}">
            <!-- Modal Chỉnh Sửa Hồ Sơ Đề Xuất Thanh Lý -->
            <div class="modal fade" th:id="'modalSuaTL_' + ${p.soPhieuTL}" tabindex="-1" aria-hidden="true"
                 th:if="${p.trangThaiDuyet == 'Chờ phê duyệt' and (session.currentUser.vaiTro.maVaiTro == 'VT_ADMIN' or session.currentUser.vaiTro.maVaiTro == 'VT_QLTS')}">
                <div class="modal-dialog modal-lg modal-dialog-centered">
                    <div class="modal-content shadow border-0">
                        <form th:action="@{/thanhly/capnhat}" method="post">
                            <input type="hidden" name="soPhieuTL" th:value="${p.soPhieuTL}">
                            <div class="modal-header bg-white border-bottom py-3 px-4">
                                <h5 class="modal-title fs-6 fw-bold text-dark">
                                    Chỉnh Sửa Hồ Sơ Thanh Lý: <span class="text-primary" th:text="${p.soPhieuTL}"></span>
                                </h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                            </div>
                            <div class="modal-body p-4">
                                <div class="row g-3">
                                    <div class="col-md-6" th:if="${!#lists.isEmpty(p.chiTietList)}">
                                        <label class="form-label fw-semibold small text-secondary">Tài Sản Đề Xuất Thanh Lý</label>
                                        <input type="text" class="form-control bg-light text-muted" th:value="${p.chiTietList[0].taiSan.tenTaiSan + ' (' + p.chiTietList[0].taiSan.maTaiSan + ')'}" readonly>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small text-secondary">Lãnh Đạo Phê Duyệt <span class="text-danger">*</span></label>
                                        <select name="maNVDuyet" class="form-select" required>
                                            <option th:each="ld : ${listLanhDao}" th:value="${ld.maNguoiDung}" 
                                                    th:text="${ld.hoTen} + ' (' + ${ld.vaiTro.tenVaiTro} + ')'" 
                                                    th:selected="${p.nvDuyet != null and ld.maNguoiDung == p.nvDuyet.maNguoiDung}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small text-secondary">Phương Thức Thanh Lý <span class="text-danger">*</span></label>
                                        <select name="phuongThucThanhLy" class="form-select" required>
                                            <option value="Bán đấu giá" th:selected="${p.phuongThucThanhLy == 'Bán đấu giá'}">Bán đấu giá</option>
                                            <option value="Bán phế liệu thu hồi" th:selected="${p.phuongThucThanhLy == 'Bán phế liệu thu hồi'}">Bán phế liệu thu hồi</option>
                                            <option value="Tiêu hủy phế liệu" th:selected="${p.phuongThucThanhLy == 'Tiêu hủy phế liệu'}">Tiêu hủy phế liệu</option>
                                            <option value="Tháo dỡ thu hồi phụ tùng" th:selected="${p.phuongThucThanhLy == 'Tháo dỡ thu hồi phụ tùng'}">Tháo dỡ thu hồi phụ tùng</option>
                                            <option value="Chuyển giao điều chuyển ngoại bộ" th:selected="${p.phuongThucThanhLy == 'Chuyển giao điều chuyển ngoại bộ'}">Chuyển giao điều chuyển ngoại bộ</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small text-secondary">Giá Trị Dự Kiến Thu Hồi (VNĐ) <span class="text-danger">*</span></label>
                                        <input type="number" step="1000" min="0" name="giaTriThuHoi" class="form-control fw-bold text-dark" th:value="${p.tongGiaTriThuHoi}" required>
                                    </div>
                                    <div class="col-12" th:if="${!#lists.isEmpty(p.chiTietList)}">
                                        <label class="form-label fw-semibold small text-secondary">Lý Do Đề Xuất Thanh Lý <span class="text-danger">*</span></label>
                                        <textarea name="lyDoThanhLy" class="form-control" rows="2" th:text="${p.chiTietList[0].lyDoThanhLy}" required></textarea>
                                    </div>
                                    <div class="col-12" th:if="${!#lists.isEmpty(p.chiTietList)}">
                                        <label class="form-label fw-semibold small text-secondary">Hình Thức Xử Lý Sau Thanh Lý <span class="text-danger">*</span></label>
                                        <textarea name="hinhThucXuLy" class="form-control" rows="2" th:text="${p.chiTietList[0].hinhThucXuLy}" required></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer bg-light border-top py-3 px-4 d-flex justify-content-end gap-2">
                                <button type="button" class="btn btn-outline-secondary px-3" data-bs-dismiss="modal">Hủy Bỏ</button>
                                <button type="submit" class="btn btn-primary px-4 fw-semibold">Lưu Thay Đổi</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </th:block>

    </div>
</div>
</body>
</html>
