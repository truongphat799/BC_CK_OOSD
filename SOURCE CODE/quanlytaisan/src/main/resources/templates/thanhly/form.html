<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: html_head('Lập Hồ Sơ Thanh Lý')}"></head>
<body>
<div th:replace="~{layout/main :: wrapper('Lập Hồ Sơ Đề Xuất Thanh Lý Tài Sản', ~{::#content})}">
    <div id="content">
        <div class="card shadow-sm border mb-4">
            <div class="card-header bg-white py-3 border-bottom">
                <span class="fw-bold text-dark">Thông Tin Hồ Sơ Thanh Lý</span>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/thanhly/luu}" th:object="${phieu}" method="post">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold small text-secondary">Số Hồ Sơ Thanh Lý <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{soPhieuTL}" class="form-control bg-light fw-bold text-dark" required readonly>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold small text-secondary">Ngày Lập Đề Xuất <span class="text-danger">*</span></label>
                            <input type="date" th:field="*{ngayThanhLy}" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold small text-secondary">Lãnh Đạo Phê Duyệt <span class="text-danger">*</span></label>
                            <select th:field="*{nvDuyet.maNguoiDung}" class="form-select" required>
                                <option value="">-- Chọn lãnh đạo duyệt --</option>
                                <option th:each="ld : ${listLanhDao}" th:value="${ld.maNguoiDung}" th:text="${ld.hoTen} + ' (' + ${ld.vaiTro.tenVaiTro} + ')'"></option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-secondary">Chọn Tài Sản Đề Xuất Thanh Lý <span class="text-danger">*</span></label>
                            <select name="maTaiSan" class="form-select" required>
                                <option value="">-- Chọn tài sản (Ưu tiên tài sản 'Chờ thanh lý') --</option>
                                <option th:each="ts : ${listTaiSanCanThanhLy}" th:value="${ts.maTaiSan}" th:text="${ts.maTaiSan} + ' - ' + ${ts.tenTaiSan} + ' (Hiện trạng: ' + ${ts.tinhTrang} + ' - Nguyên giá: ' + ${#numbers.formatDecimal(ts.nguyenGia, 0, 'COMMA', 0, 'POINT')} + ' đ)'"></option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-secondary">Giá Trị Dự Kiến Thu Hồi (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" step="1000" min="0" name="giaTriThuHoi" class="form-control fw-bold text-dark" placeholder="500000" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-secondary">Lý Do Đề Xuất Thanh Lý <span class="text-danger">*</span></label>
                            <textarea name="lyDoThanhLy" class="form-control" rows="2" placeholder="Hết niên hạn sử dụng, hư hỏng nặng chi phí sửa quá lớn..." required></textarea>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold small text-secondary">Hình Thức Xử Lý Sau Thanh Lý <span class="text-danger">*</span></label>
                            <textarea name="hinhThucXuLy" class="form-control" rows="2" placeholder="Bán đấu giá xung công quỹ / Tháo dỡ linh kiện tận dụng..." required></textarea>
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-top d-flex gap-2 justify-content-end">
                        <a th:href="@{/thanhly}" class="btn btn-outline-secondary px-4">Quay lại</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            Trình hồ sơ phê duyệt
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
