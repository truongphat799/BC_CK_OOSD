<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản Lý Tài Sản Cố Định</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
        }
        .login-card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35), 0 10px 20px -5px rgba(0, 0, 0, 0.2);
            padding: 2.25rem;
        }
        .login-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }
        .login-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: 0.02em;
            margin-bottom: 0.35rem;
        }
        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border-color: #cbd5e1;
            font-size: 0.92rem;
        }
        .form-control:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
        }
        .input-group-text {
            background-color: #f8fafc;
            border-color: #cbd5e1;
            color: #64748b;
        }
        .btn-primary {
            background-color: #1a73e8;
            border-color: #1a73e8;
            padding: 0.75rem;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 0.5rem;
            letter-spacing: 0.01em;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background-color: #1557b0;
            border-color: #1557b0;
        }
        .test-accounts-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 0.75rem 0.85rem;
            font-size: 0.8rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <h4 class="login-title">QUẢN LÝ TÀI SẢN CỐ ĐỊNH</h4>
        <p class="text-muted small mb-0">Đăng nhập tài khoản để vào hệ thống</p>
    </div>

    <!-- Alert messages -->
    <div th:if="${errorMsg}" class="alert alert-danger py-2 small" role="alert">
        <i class="fa-solid fa-triangle-exclamation me-1"></i> <span th:text="${errorMsg}"></span>
    </div>
    <div th:if="${successMsg}" class="alert alert-success py-2 small" role="alert">
        <i class="fa-solid fa-circle-check me-1"></i> <span th:text="${successMsg}"></span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Tên đăng nhập</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                <input type="text" class="form-control" name="username" placeholder="Nhập tên đăng nhập" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary">Mật khẩu</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" id="loginPassword" class="form-control border-end-0" name="password" placeholder="Nhập mật khẩu" required autocomplete="current-password">
                <button type="button" class="btn btn-outline-secondary border-start-0 bg-white text-muted" onclick="togglePasswordVisibility('loginPassword', this)" title="Hiện / Ẩn mật khẩu" style="border-color: #cbd5e1;">
                    <i class="fa-solid fa-eye-slash"></i>
                </button>
            </div>
        </div>

        <div class="pt-2">
            <button type="submit" class="btn btn-primary w-100 shadow-sm">
                Đăng nhập
            </button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePasswordVisibility(inputId, btn) {
        var input = document.getElementById(inputId);
        if (!input) return;
        var icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            if (icon) {
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
                icon.classList.add('text-primary');
            }
        } else {
            input.type = 'password';
            if (icon) {
                icon.classList.remove('fa-eye');
                icon.classList.remove('text-primary');
                icon.classList.add('fa-eye-slash');
            }
        }
    }
</script>
</body>
</html>
