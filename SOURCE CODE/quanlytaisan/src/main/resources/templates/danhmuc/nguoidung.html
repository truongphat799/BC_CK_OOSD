<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: html_head('Quản Lý Tài Khoản & Phân Quyền')}"></head>
<body>
<div th:replace="~{layout/main :: wrapper('Quản Lý Tài Khoản & Phân Quyền Vai Trò', ~{::#content})}">
    <div id="content">
        <div class="card shadow-sm border mb-4">
            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3 border-bottom">
                <div>
                    <span class="fw-bold text-dark">Danh Sách Cán Bộ Nhân Viên Hệ Thống</span>
                    <span class="badge bg-light text-secondary border ms-2" th:text="${#lists.size(listNguoiDung)} + ' tài khoản'"></span>
                </div>
                <!-- Nút Thêm Tài Khoản Mới ở trên cùng bên phải mở Modal -->
                <button type="button" class="btn btn-sm btn-primary fw-semibold px-3" data-bs-toggle="modal" data-bs-target="#modalThemNguoiDung">
                    Thêm Tài Khoản Mới
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th class="text-nowrap" style="width: 100px;">Mã ND</th>
                            <th class="text-nowrap" style="min-width: 180px;">Họ Tên</th>
                            <th class="text-nowrap" style="width: 140px;">Tên Đăng Nhập</th>
                            <th class="text-nowrap" style="width: 140px;">Vai Trò</th>
                            <th class="text-nowrap" style="width: 180px;">Phòng Ban</th>
                            <th class="text-nowrap" style="width: 140px;">Trạng Thái</th>
                            <th class="text-center text-nowrap" style="width: 120px;">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="nd : ${listNguoiDung}">
                            <td><code class="fw-bold" th:text="${nd.maNguoiDung}"></code></td>
                            <td>
                                <strong th:text="${nd.hoTen}"></strong>
                                <br><small class="text-muted" th:text="${nd.email}"></small>
                                <span th:if="${nd.soDienThoai != null and nd.soDienThoai != ''}" class="text-muted small"> • <span th:text="${nd.soDienThoai}"></span></span>
                            </td>
                            <td><code th:text="${nd.tenDangNhap}"></code></td>
                            <td><span class="badge bg-white text-dark border px-2.5 py-1 fw-semibold" th:text="${nd.vaiTro.tenVaiTro}"></span></td>
                            <td th:text="${nd.phongBan.tenPhongBan}"></td>
                            <td>
                                <span class="badge" th:classappend="${nd.trangThai == 'Đang hoạt động' ? 'badge-status-sudung' : 'badge-status-thanhly'}" th:text="${nd.trangThai}"></span>
                            </td>
                            <td class="text-center text-nowrap">
                                <!-- Nút Sửa: Mở Modal chỉnh sửa (Giữ lại icon thao tác) -->
                                <button type="button" class="btn btn-sm btn-outline-primary me-1" 
                                        data-bs-toggle="modal" th:data-bs-target="'#modalEdit_' + ${nd.maNguoiDung}" 
                                        title="Chỉnh sửa thông tin tài khoản">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                
                                <!-- Với tài khoản Quản trị viên: Bỏ nút Khóa và nút Xóa, chỉ hiển thị cho tài khoản không phải Quản trị viên -->
                                <th:block th:if="${nd.vaiTro.maVaiTro != 'VT_ADMIN' and nd.maNguoiDung != 'admin' and nd.maNguoiDung != 'ND_01'}">
                                    <!-- Nút Khóa / Mở (Giữ lại icon thao tác) -->
                                    <a th:href="@{'/danhmuc/nguoidung/trangthai/' + ${nd.maNguoiDung}}" 
                                       class="btn btn-sm me-1" 
                                       th:classappend="${nd.trangThai == 'Đang hoạt động' ? 'btn-outline-warning' : 'btn-outline-success'}" 
                                       th:title="${nd.trangThai == 'Đang hoạt động' ? 'Khóa tài khoản' : 'Mở khóa tài khoản'}">
                                        <i class="fa-solid" th:classappend="${nd.trangThai == 'Đang hoạt động' ? 'fa-lock' : 'fa-lock-open'}"></i>
                                    </a>

                                    <!-- Nút Xóa (Giữ lại icon thao tác) -->
                                    <a th:href="@{'/danhmuc/nguoidung/xoa/' + ${nd.maNguoiDung}}" 
                                       class="btn btn-sm btn-outline-danger" 
                                       th:title="'Xóa tài khoản ' + ${nd.hoTen}"
                                       onclick="return confirm('CẢNH BÁO: Bạn có chắc chắn muốn xóa tài khoản này? Hành động này không thể hoàn tác!');">
                                        <i class="fa-solid fa-trash"></i>
                                    </a>
                                </th:block>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listNguoiDung)}">
                            <td colspan="7" class="text-center text-muted py-4">Chưa có người dùng nào được tạo!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Modal Tạo Tài Khoản Mới -->
        <div class="modal fade" id="modalThemNguoiDung" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content shadow border-0">
                    <form th:action="@{/danhmuc/nguoidung/luu}" th:object="${nguoiDungMoi}" method="post">
                        <div class="modal-header bg-white border-bottom py-3 px-4">
                            <h5 class="modal-title fs-6 fw-bold text-dark">Thêm Tài Khoản Mới</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                        </div>
                        <div class="modal-body p-4">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Mã Người Dùng <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{maNguoiDung}" class="form-control" placeholder="VD: ND_05" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Tên Đăng Nhập <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{tenDangNhap}" class="form-control" placeholder="VD: nva" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Họ và Tên <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{hoTen}" class="form-control" placeholder="VD: Nguyễn Văn A" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Mật Khẩu Ban Đầu</label>
                                    <input type="password" th:field="*{matKhau}" class="form-control" placeholder="Mặc định: 123 (nếu để trống)">
                                    <div class="form-text text-muted small">Để trống sẽ tự động đặt mật khẩu mặc định là 123</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Vai Trò Phân Quyền <span class="text-danger">*</span></label>
                                    <select th:field="*{vaiTro.maVaiTro}" class="form-select" required>
                                        <option value="">-- Chọn vai trò --</option>
                                        <option th:each="vt : ${listVaiTro}" th:value="${vt.maVaiTro}" th:text="${vt.tenVaiTro}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Phòng Ban Công Tác <span class="text-danger">*</span></label>
                                    <select th:field="*{phongBan.maPhongBan}" class="form-select" required>
                                        <option value="">-- Chọn phòng ban --</option>
                                        <option th:each="pb : ${listPhongBan}" th:value="${pb.maPhongBan}" th:text="${pb.tenPhongBan}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Email <span class="text-danger">*</span></label>
                                    <input type="email" th:field="*{email}" class="form-control" placeholder="VD: nva@hcmunre.edu.vn" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Số Điện Thoại</label>
                                    <input type="text" th:field="*{soDienThoai}" class="form-control" placeholder="VD: 0901234567">
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer bg-light border-top py-3 px-4 d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-outline-secondary px-3" data-bs-dismiss="modal">Hủy Bỏ</button>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">Lưu tài khoản</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Các Modal Chỉnh Sửa Người Dùng (Render cho từng dòng) -->
        <th:block th:each="nd : ${listNguoiDung}">
            <div class="modal fade" th:id="'modalEdit_' + ${nd.maNguoiDung}" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-lg modal-dialog-centered">
                    <div class="modal-content shadow border-0">
                        <form th:action="@{/danhmuc/nguoidung/capnhat}" method="post">
                            <div class="modal-header bg-white border-bottom py-3 px-4">
                                <h5 class="modal-title fs-6 fw-bold text-dark">
                                    Chỉnh Sửa Tài Khoản: <span th:text="${nd.hoTen}"></span> (<span th:text="${nd.maNguoiDung}"></span>)
                                </h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                            </div>
                            <div class="modal-body p-4">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small text-secondary">Mã Người Dùng</label>
                                        <input type="text" name="maNguoiDung" th:value="${nd.maNguoiDung}" readonly class="form-control bg-light fw-bold text-secondary">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small text-secondary">Tên Đăng Nhập <span class="text-danger">*</span></label>
                                        <input type="text" name="tenDangNhap" th:value="${nd.tenDangNhap}" required class="form-control">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small text-secondary">Họ và Tên <span class="text-danger">*</span></label>
                                        <input type="text" name="hoTen" th:value="${nd.hoTen}" required class="form-control">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small text-secondary">Trạng Thái Hoạt Động</label>
                                        <select name="trangThai" class="form-select">
                                            <option value="Đang hoạt động" th:selected="${nd.trangThai == 'Đang hoạt động'}">Đang hoạt động</option>
                                            <option value="Bị khóa" th:selected="${nd.trangThai == 'Bị khóa'}">Bị khóa</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small text-secondary">Vai Trò Phân Quyền <span class="text-danger">*</span></label>
                                        <select name="vaiTro.maVaiTro" class="form-select" required>
                                            <option th:each="vt : ${listVaiTro}" th:value="${vt.maVaiTro}" th:text="${vt.tenVaiTro}" th:selected="${nd.vaiTro != null and vt.maVaiTro == nd.vaiTro.maVaiTro}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small text-secondary">Phòng Ban Công Tác <span class="text-danger">*</span></label>
                                        <select name="phongBan.maPhongBan" class="form-select" required>
                                            <option th:each="pb : ${listPhongBan}" th:value="${pb.maPhongBan}" th:text="${pb.tenPhongBan}" th:selected="${nd.phongBan != null and pb.maPhongBan == nd.phongBan.maPhongBan}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small text-secondary">Email <span class="text-danger">*</span></label>
                                        <input type="email" name="email" th:value="${nd.email}" required class="form-control">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small text-secondary">Số Điện Thoại</label>
                                        <input type="text" name="soDienThoai" th:value="${nd.soDienThoai}" class="form-control" placeholder="VD: 0901234567">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label fw-semibold small text-secondary">Đổi Mật Khẩu Mới (Tùy chọn)</label>
                                        <input type="password" name="matKhauMoi" class="form-control" placeholder="Để trống nếu muốn giữ nguyên mật khẩu hiện tại">
                                        <div class="form-text text-muted small">Chỉ điền vào ô này nếu bạn muốn đặt lại mật khẩu cho tài khoản.</div>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer bg-light border-top py-3 px-4 d-flex justify-content-end gap-2">
                                <button type="button" class="btn btn-outline-secondary px-3" data-bs-dismiss="modal">Hủy Bỏ</button>
                                <button type="submit" class="btn btn-primary px-4 fw-semibold">Lưu Cập Nhật</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </th:block>

    </div>
</div>
</body>
</html>
